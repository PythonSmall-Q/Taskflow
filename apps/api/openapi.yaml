openapi: 3.0.3
info:
  title: Taskflow Zero API
  version: 0.1.0
  description: Basic endpoints for auth, projects, tasks, files, realtime
servers:
  - url: /
paths:
  /:
    get:
      summary: Health
      responses:
        '200': { description: OK }
  /auth/register:
    post:
      summary: Register with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
              required: [email, password, name]
      responses:
        '200': { description: JWT and user }
  /automation:
    get:
      summary: List automation rules
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of rules }
    post:
      summary: Create automation rule
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                trigger: { type: string, enum: [task.created, task.status_changed, task.due_soon, task.overdue] }
                action: { type: string, enum: [webhook.call, notify.user] }
                config: { type: object }
              required: [name, trigger, action]
      responses:
        '201': { description: Rule created }
  /integrations/notify:
    post:
      summary: Send a message to a webhook (Slack/Discord)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                payload: { type: object }
              required: [url]
      responses:
        '200': { description: OK }
  /internal/process-due:
  /realtime/schedule/{id}:
    post:
      summary: Schedule DO alarm for due processing
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Scheduled }
  /integrations/calendar:
    post:
      summary: Create Google Calendar event (requires user access token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accessToken: { type: string }
                summary: { type: string }
                start: { type: string, format: date-time }
                end: { type: string, format: date-time }
                timezone: { type: string }
              required: [accessToken, summary, start, end]
      responses:
        '200': { description: Event created }
  /comments:
    post:
      summary: Create comment with optional attachments and @mentions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCommentForm'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCommentResponse'
  /internal/process-due:
    post:
      summary: Process due tasks to fire due_soon/overdue
      responses:
        '200': { description: OK }
  /auth/login:
    post:
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
              required: [email, password]
      responses:
        '200': { description: JWT and user }
  /projects:
    get:
      summary: List projects for current user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of projects }
    post:
      summary: Create project in first team
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                color: { type: string }
              required: [name]
      responses:
        '201': { description: Project created }
  /comments/task/{taskId}:
    get:
      summary: List comments for a task
      tags: [Comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCommentsResponse'
  /tasks/{projectId}:
    get:
      summary: List tasks in project
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      responses:
        '200': { description: List of tasks }
  /tasks:
    post:
      summary: Create task
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId: { type: string }
                title: { type: string }
              required: [projectId, title]
      responses:
        '201': { description: Task created }
  /tasks/move:
    post:
      summary: Move task to status
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                status: { type: string, enum: [todo, in_progress, review, done] }
                rank: { type: integer }
              required: [id, status, rank]
      responses:
        '200': { description: OK }
  /files:
    post:
      summary: Upload file
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200': { description: File key and URL }
  /files/{key}:
    get:
      summary: Get file by key
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string }
      responses:
        '200': { description: File stream }
  /teams:
    get:
      summary: List teams for current user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of teams }
    post:
      summary: Create team
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
              required: [name]
      responses:
        '200': { description: Team created }
  /teams/{id}/invite:
    post:
      summary: Create invite token
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Invite created }
  /teams/join/{token}:
    post:
      summary: Join via invite
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '200': { description: Joined }
  /realtime/room/{id}:
    get:
      summary: Connect to room (WebSocket)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '101': { description: WebSocket upgrade }
  /oauth/google/start:
    get:
      summary: Redirect to Google OAuth start
      responses:
        '302': { description: Redirect }
  /oauth/google/callback:
    get:
      summary: Google OAuth callback
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
      responses:
        '200': { description: JWT }
  /oauth/github/start:
    get:
      summary: Redirect to GitHub OAuth start
      responses:
        '302': { description: Redirect }
  /oauth/github/callback:
    get:
      summary: GitHub OAuth callback
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
      responses:
        '200': { description: JWT }
  /ai/auto-tag:
    post:
      summary: Suggest tags via AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        '200': { description: Tags }
  /ai/assign:
    post:
      summary: Suggest assignee via AI
      responses:
        '200': { description: Suggested assignee }
  /api-keys:
    get:
      summary: List API keys for current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
    post:
      summary: Create API key
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
      responses:
        '200':
          description: New key
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
  /api-keys/revoke/{id}:
    post:
      summary: Revoke API key
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Revoked }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiKey:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        label: { type: string }
        created_at: { type: integer }
        revoked: { type: integer }
      example:
        id: key_123
        key: abcd1234efgh5678
        label: CI pipeline
        created_at: 1733420000000
        revoked: 0
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
      example:
        id: usr_123
        email: alice@example.com
        name: Alice
    Comment:
      type: object
      properties:
        id: { type: string }
        task_id: { type: string }
        user_id: { type: string }
        body: { type: string }
        created_at: { type: integer }
      example:
        id: cmt_001
        task_id: tsk_123
        user_id: usr_123
        body: "Looks good!\n\n- [ ] Follow up"
        created_at: 1733420000000
    CreateCommentForm:
      type: object
      required: [taskId, body]
      properties:
        taskId: { type: string }
        body: { type: string }
        files:
          type: array
          items:
            type: string
            format: binary
      example:
        taskId: tsk_123
        body: "@bob@example.com please review the checklist."
    CreateCommentResponse:
      type: object
      properties:
        comment:
          $ref: '#/components/schemas/Comment'
      example:
        comment:
          id: cmt_002
          task_id: tsk_123
          user_id: usr_456
          body: "Added attachment and notes"
          created_at: 1733421000000
    ListCommentsResponse:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
      example:
        comments:
          - id: cmt_001
            task_id: tsk_123
            user_id: usr_123
            body: "Initial thoughts"
            created_at: 1733420000000
          - id: cmt_002
            task_id: tsk_123
            user_id: usr_456
            body: "Added attachment and notes"
            created_at: 1733421000000
